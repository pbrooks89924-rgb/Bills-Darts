<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leaderboard - Bills Darts Predictor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <p class="kicker">Bills fantasy darts</p>
    <h1>League</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2>League Leaderboard</h2>
      <p>5 points for exact scoreline · 2 points for correct winner · 0 for wrong</p>
      <div id="lb-container">Loading...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    async function loadLeaderboard() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=leaderboard`);
        const data = await res.json();
        if (!data.length) {
          document.getElementById('lb-container').innerHTML = '<p>No predictions yet.</p>';
          return;
        }
        const rounds = ['Last32', 'Last16', 'QuarterFinal', 'SemiFinal', 'Final'];
        let html = '<table><thead><tr><th>Pos</th><th>Name</th>';
        rounds.forEach(r => html += `<th>${r}</th>`);
        html += '<th>Total</th></tr></thead><tbody>';
        data.forEach((row, i) => {
          html += `<tr><td>${i + 1}</td><td>${row.Name}</td>`;
          rounds.forEach(r => html += `<td>${row[r] || 0}</td>`);
          html += `<td><strong>${row.Total || 0}</strong></td></tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('lb-container').innerHTML = html;
      } catch (e) {
        document.getElementById('lb-container').innerHTML = '<p>Could not load leaderboard. Check config.js</p>';
      }
    }
    loadLeaderboard();
  </script>
  <nav>
    <a href="index.html">Predict</a>
    <a href="leaderboard.html" class="active">Table</a>
    <a href="admin.html">Admin</a>
  </nav>
</body>
</html>
