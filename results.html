<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Results - Bills Darts Predictor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <header>
    <h1>Billsys Predictions</h1>
    <p class="kicker">Results</p>
  </header>

  <div class="container">
    <div class="switch">
      <a href="admin.html">Draw</a>
      <a href="results.html" class="active">Results</a>
    </div>
    <div class="card">
      <h2>Enter results</h2>
      <label>Round</label>
      <select id="round" onchange="loadMatches()">
        <option>Last32</option>
        <option>Last16</option>
        <option>QuarterFinal</option>
        <option>SemiFinal</option>
        <option>Final</option>
      </select>
      <button onclick="loadMatches()">Load Matches</button>
    </div>

    <div class="card hidden" id="results-card">
      <h2 id="round-label">Results</h2>
      <div id="matches-container"></div>
      <button onclick="submitResults()">Submit Results & Calculate Points</button>
      <div id="status"></div>
    </div>
  </div>

  <script src="wheels.js?v=3"></script>
  <script src="config.js"></script>
  <script src="busy.js?v=1"></script>
  <script>
    let matches = [];

    async function loadMatches() {
      const round = document.getElementById('round').value;
      try {
        const res = await fetch(`${SCRIPT_URL}?action=matches&round=${round}`);
        matches = await res.json();
        if (!matches.length) {
          alert('No matches found for this round');
          return;
        }
        document.getElementById('round-label').textContent = `Enter results for ${round}`;
        document.getElementById('results-card').classList.remove('hidden');
        renderMatches();
      } catch (e) {
        alert('Error loading matches');
      }
    }

    function renderMatches() {
      const container = document.getElementById('matches-container');
      container.innerHTML = matches.map(m => {
        const firstTo = Number(m.FirstTo) || 0;
        function scoreOrTop(value) {
          if (value === '' || value === undefined || value === null) return firstTo;
          const n = Number(value);
          return Number.isFinite(n) ? n : firstTo;
        }
        const s1 = scoreOrTop(m.Score1);
        const s2 = scoreOrTop(m.Score2);
        return `
        <article class="match-card" data-id="${m.MatchID}">
          <p class="eyebrow">First to ${m.FirstTo}</p>
          <div class="vs-line">
            <p class="pname">${m.Player1}</p>
            <div class="score-wheel" data-max="${firstTo}" data-value="${s1}" data-target="s1" data-label="${m.Player1} score"></div>
            <div class="score-wheel" data-max="${firstTo}" data-value="${s2}" data-target="s2" data-label="${m.Player2} score"></div>
            <p class="pname right">${m.Player2}</p>
          </div>
          <input type="hidden" class="s1" value="${s1}">
          <input type="hidden" class="s2" value="${s2}">
        </article>`;
      }).join('');
      initWheels(container);
    }

    async function submitResults() {
      const rows = document.querySelectorAll('.match-card');
      const results = [];
      rows.forEach(row => {
        const s1 = parseInt(row.querySelector('.s1').value);
        const s2 = parseInt(row.querySelector('.s2').value);
        if (!isNaN(s1) && !isNaN(s2)) {
          results.push({ matchId: row.dataset.id, score1: s1, score2: s2 });
        }
      });
      if (!results.length) return alert('Enter at least one result');

      showStatus('Submitting...', '');
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'submitResults', results })
        });
        const data = await res.json();
        if (data.success) {
          showStatus(data.message || 'Results saved and points calculated!', 'success');
        } else {
          showStatus(data.error || 'Error', 'error');
        }
      } catch (e) {
        showStatus('Network error', 'error');
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    // Auto load current
    loadMatches();
  </script>
  <nav>
    <a href="index.html">Predict</a>
    <a href="leaderboard.html">Table</a>
    <a href="admin.html" class="active">Admin</a>
  </nav>
</body>
</html>
