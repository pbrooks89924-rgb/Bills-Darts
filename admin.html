<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin - Bills Darts Predictor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <header>
    <h1>Billsys Predictions</h1>
    <p class="kicker">Admin</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="lock-row">
        <div>
          <h2>Lock predictions</h2>
          <p id="lock-note">Checking…</p>
        </div>
        <button type="button" id="lock-toggle" class="lock-switch" aria-pressed="false" aria-label="Lock predictions" onclick="toggleLock()">
          <span></span>
        </button>
      </div>
    </div>
    <div class="switch">
      <a href="admin.html" class="active">Draw</a>
      <a href="results.html">Results</a>
    </div>
    <div class="card">
      <h2>Set up matches for a round</h2>
      <label>Round</label>
      <select id="round" onchange="players = []; matchesToAdd = []; eliminated = []; document.getElementById('setup-card').classList.add('hidden');">
        <option>Last32</option>
        <option>Last16</option>
        <option>QuarterFinal</option>
        <option>SemiFinal</option>
        <option>Final</option>
      </select>
      <label>First to (sets)</label>
      <input type="number" id="firstTo" value="5" min="3" max="7">
      <button onclick="loadPlayers()">Load Players</button>
    </div>

    <div class="card hidden" id="setup-card">
      <h2>Add Matches</h2>
      <div id="add-form">
        <label>Player 1</label>
        <select id="p1"></select>
        <label>Player 2</label>
        <select id="p2"></select>
        <button onclick="addMatch()">Add Match</button>
      </div>
      <p id="draw-note"></p>
      <h3>Matches to submit</h3>
      <div id="match-list"></div>
      <button onclick="submitMatches()" class="secondary">Submit all matches to sheet</button>
      <div id="status"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="busy.js?v=1"></script>
  <script>
    let players = [];
    let eliminated = [];
    let matchesToAdd = [];
    const ROUNDS = ['Last32', 'Last16', 'QuarterFinal', 'SemiFinal', 'Final'];

    function loserOf(match) {
      const completed = match.Completed === true || String(match.Completed).toLowerCase() === 'true';
      if (!completed) return '';
      const winner = String(match.Winner || '');
      if (winner && winner !== 'Draw') {
        if (winner === match.Player1) return match.Player2;
        if (winner === match.Player2) return match.Player1;
      }
      const s1 = Number(match.Score1);
      const s2 = Number(match.Score2);
      if (Number.isFinite(s1) && Number.isFinite(s2) && s1 !== s2) return s1 > s2 ? match.Player2 : match.Player1;
      return '';
    }

    async function matchesFor(round) {
      const res = await fetch(`${SCRIPT_URL}?action=matches&round=${encodeURIComponent(round)}`);
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    function byName(a, b) {
      return String(a).localeCompare(String(b), undefined, { sensitivity: 'base' });
    }

    function stillAvailable() {
      const taken = new Set();
      matchesToAdd.forEach(function (match) {
        taken.add(match.player1);
        taken.add(match.player2);
      });
      const gone = new Set(eliminated);
      return players.filter(function (name) { return name && !taken.has(name) && !gone.has(name); }).sort(byName);
    }

    function fillSelect(id, names, selected) {
      const select = document.getElementById(id);
      select.innerHTML = '';
      names.forEach(function (name) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        if (name === selected) option.selected = true;
        select.appendChild(option);
      });
    }

    var pickerLock = false;
    function renderPickers() {
      if (pickerLock) return;
      pickerLock = true;
      const left = stillAvailable();
      const form = document.getElementById('add-form');
      const note = document.getElementById('draw-note');
      if (left.length < 2) {
        form.classList.add('hidden');
        note.textContent = 'No players left to draw.';
        pickerLock = false;
        return;
      }
      form.classList.remove('hidden');
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      const chosen1 = left.indexOf(p1) >= 0 ? p1 : left[0];
      let chosen2 = left.indexOf(p2) >= 0 ? p2 : '';
      if (!chosen2 || chosen2 === chosen1) {
        chosen2 = left.filter(function (name) { return name !== chosen1; })[0];
      }
      fillSelect('p1', left.filter(function (name) { return name !== chosen2; }), chosen1);
      fillSelect('p2', left.filter(function (name) { return name !== chosen1; }), chosen2);
      note.textContent = left.length + ' still to draw' + (eliminated.length ? '. ' + eliminated.length + ' already out.' : '');
      pickerLock = false;
    }

    document.getElementById('p1').addEventListener('change', renderPickers);
    document.getElementById('p2').addEventListener('change', renderPickers);

    async function loadPlayers() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=players`);
        players = await res.json();
        if (!Array.isArray(players) || !players.length) {
          alert('No players found. Add them in the Players sheet first.');
          return;
        }
        players = players.filter(Boolean).sort(byName);
        const round = document.getElementById('round').value;
        const earlier = ROUNDS.slice(0, ROUNDS.indexOf(round));
        const prior = [];
        for (let i = 0; i < earlier.length; i++) {
          const rows = await matchesFor(earlier[i]);
          rows.forEach(function (match) { prior.push(match); });
        }
        eliminated = prior.map(loserOf).filter(Boolean);
        const current = await matchesFor(round);
        matchesToAdd = current.filter(function (match) { return match.Player1 && match.Player2; }).map(function (match) {
          return { player1: match.Player1, player2: match.Player2 };
        });
        document.getElementById('setup-card').classList.remove('hidden');
        renderList();
      } catch (e) {
        alert('Error loading players. Check SCRIPT_URL');
      }
    }

    function addMatch() {
      const left = stillAvailable();
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      if (!p1 || !p2 || p1 === p2 || left.indexOf(p1) < 0 || left.indexOf(p2) < 0) {
        return alert('Pick two different players who are still in.');
      }
      matchesToAdd.push({ player1: p1, player2: p2 });
      renderList();
    }

    function renderList() {
      const list = document.getElementById('match-list');
      list.innerHTML = '';
      if (!matchesToAdd.length) {
        const empty = document.createElement('p');
        empty.textContent = 'No matches added yet';
        list.appendChild(empty);
      } else {
        matchesToAdd.forEach(function (match, index) {
          const row = document.createElement('div');
          row.className = 'match-row';
          const name = document.createElement('span');
          name.className = 'tie-name';
          name.textContent = match.player1 + ' vs ' + match.player2;
          const remove = document.createElement('span');
          remove.className = 'remove';
          remove.setAttribute('role', 'button');
          remove.tabIndex = 0;
          remove.textContent = 'Remove';
          remove.addEventListener('click', function () { removeMatch(index); });
          row.appendChild(name);
          row.appendChild(remove);
          list.appendChild(row);
        });
      }
      renderPickers();
    }

    function removeMatch(i) {
      matchesToAdd.splice(i, 1);
      renderList();
    }

    async function submitMatches() {
      if (!matchesToAdd.length) return alert('Add some matches first');
      const round = document.getElementById('round').value;
      const firstTo = parseInt(document.getElementById('firstTo').value);
      showStatus('Submitting...', '');
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'setupMatches',
            round,
            firstTo,
            matches: matchesToAdd
          })
        });
        const data = await res.json();
        if (data.success) {
          showStatus(`Success! ${data.count} matches set for ${round}. Current round updated.`, 'success');
          renderList();
        } else {
          showStatus(data.error || 'Error', 'error');
        }
      } catch (e) {
        showStatus('Network error', 'error');
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function setLockUi(on) {
      const button = document.getElementById('lock-toggle');
      button.classList.toggle('on', on);
      button.setAttribute('aria-pressed', on ? 'true' : 'false');
      document.getElementById('lock-note').textContent = on
        ? 'On. Nobody can edit predictions.'
        : 'Off. Only unfinished matches can be edited.';
    }

    async function loadLock() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=config`);
        const cfg = await res.json();
        setLockUi(cfg.predictionsLocked === true);
      } catch (e) {
        document.getElementById('lock-note').textContent = 'Could not read the lock. Redeploy the Apps Script.';
      }
    }

    async function toggleLock() {
      const next = document.getElementById('lock-toggle').getAttribute('aria-pressed') !== 'true';
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'setPredictionsLocked', locked: next })
        });
        const data = await res.json();
        if (!data.success) {
          alert(data.error || 'Could not update the lock. Redeploy the Apps Script.');
          return;
        }
        setLockUi(data.predictionsLocked === true);
      } catch (e) {
        alert('Could not update the lock. Redeploy the Apps Script.');
      }
    }

    loadLock();
  </script>
  <nav>
    <a href="index.html">Predict</a>
    <a href="leaderboard.html">Table</a>
    <a href="admin.html" class="active">Admin</a>
  </nav>
</body>
</html>
